spring:
  application:
    name: promostandards

  # ---------------------------------------------------------------------------
  # Postgres (opt-in, see sync.persistence.enabled below)
  #
  # With persistence disabled — the default — PersistenceAutoConfigurationExcluder drops the
  # DataSource/Flyway auto-configuration, so these blanks never fail startup and the app behaves
  # exactly as it did before the database existed.
  #
  # With it enabled, a broken database SHOULD fail startup loudly: a sync running without its
  # bookkeeping would treat "no state" as "push everything" and re-write the whole catalog.
  #
  # The password is sensitive: supply it via DB_PASSWORD (or an untracked application-local.yaml).
  # ---------------------------------------------------------------------------
  datasource:
    url: "${DB_URL:}"
    username: "${DB_USER:postgres}"
    password: "${DB_PASSWORD:}"
    hikari:
      maximum-pool-size: 10
      connection-timeout: 5000
      pool-name: promostandards-pool
  flyway:
    locations: classpath:db/migration
    # Applied migrations are immutable: every later change is a new V2__/V3__ file, never an edit.
    validate-on-migrate: true

# ---------------------------------------------------------------------------
# App access protection (form login)
#
# A single username/password gate over the whole app. Sensitive endpoints (/api/**
# and /actuator/**) require a session cookie set by the console's login screen; the
# static console shell and /actuator/health stay open (so the login page can render
# and the Docker healthcheck keeps working). Off by default so local/stub development
# and the test suite need no credentials; the prod profile turns it on (see
# application-prod.yaml).
#
# The password is sensitive: supply it via APP_AUTH_PASSWORD (or an untracked
# application-local.yaml) — never commit a real password. To try it locally run with
# `--security.auth.enabled=true --security.auth.password=secret`.
#
# cookie-secure: leave false for plain-HTTP local runs; set true in prod (HTTPS).
# session-minutes: how long a login stays valid before re-authentication (default 12h).
# ---------------------------------------------------------------------------
security:
  auth:
    enabled: false
    username: "${APP_AUTH_USERNAME:admin}"
    password: "${APP_AUTH_PASSWORD:}"
    cookie-secure: false
    session-minutes: 720

# ---------------------------------------------------------------------------
# PromoStandards integration
#
# Each service runs against a swappable client. With mode=stub (the default)
# the bundled in-memory StubXxxClient is used. Set mode=soap once a real SOAP
# client bean is wired (see README.md) and supply the endpoint-url + credentials.
#
# Credentials are sensitive: provide them via environment variables or an
# untracked application-local.yaml (see application-local.yaml.example) — never
# commit real credentials.
# ---------------------------------------------------------------------------
promostandards:
  # Supplier account credentials (sent with every request; unused by stubs)
  credentials:
    id: "${PROMOSTANDARDS_CREDENTIALS_ID:}"
    password: "${PROMOSTANDARDS_CREDENTIALS_PASSWORD:}"

  # Inventory Service 1.2.1
  inventory:
    mode: stub                       # stub (default) | soap
    ws-version: 1.2.1
    endpoint-url: "${PROMOSTANDARDS_INVENTORY_ENDPOINT:}"
    # SOAP client tuning (only used when mode=soap)
    connect-timeout-ms: 10000
    receive-timeout-ms: 30000
    log-messages: false

  # Product Data Service 1.0.0
  product-data:
    mode: stub                       # stub (default) | soap
    ws-version: 1.0.0
    endpoint-url: "${PROMOSTANDARDS_PRODUCT_ENDPOINT:}"
    connect-timeout-ms: 10000
    receive-timeout-ms: 30000
    log-messages: false

  # Pricing and Configuration Service 1.0.0
  pricing:
    mode: stub                       # stub (default) | soap
    ws-version: 1.0.0
    endpoint-url: "${PROMOSTANDARDS_PRICING_ENDPOINT:}"
    connect-timeout-ms: 10000
    receive-timeout-ms: 30000
    log-messages: false

  # Media Content Service 1.1.0
  media:
    mode: stub                       # stub (default) | soap
    ws-version: 1.1.0
    endpoint-url: "${PROMOSTANDARDS_MEDIA_ENDPOINT:}"
    connect-timeout-ms: 10000
    receive-timeout-ms: 30000
    log-messages: false

  # Order Shipment Notification Service 1.0.0
  order-shipment:
    mode: stub                       # stub (default) | soap
    ws-version: 1.0.0
    endpoint-url: "${PROMOSTANDARDS_ORDER_SHIPMENT_ENDPOINT:}"
    connect-timeout-ms: 10000
    receive-timeout-ms: 30000
    log-messages: false

  # Order Status Service 1.0.0
  order-status:
    mode: stub                       # stub (default) | soap
    ws-version: 1.0.0
    endpoint-url: "${PROMOSTANDARDS_ORDER_STATUS_ENDPOINT:}"
    connect-timeout-ms: 10000
    receive-timeout-ms: 30000
    log-messages: false

# ---------------------------------------------------------------------------
# Quantity-break discounts.
#
# A Shopify variant carries one price - the first break's - so every cheaper break is published as
# JSON in ONE metafield, which the store's discount app reads:
#
#   {"currencyCode":"USD","tiers":[{"minQuantity":25,"discountAmount":0},
#                                  {"minQuantity":75,"discountAmount":1},
#                                  {"minQuantity":150,"discountAmount":4}]}
#
# discountAmount is HOW MUCH COMES OFF one unit from that quantity up (0 on the base tier = the
# variant's own price); the example is CM373BS, whose table is 19.99 / 18.99 / 15.99. The base
# tier's minQuantity is the supplier's first break. The value is written on every covered variant
# and, when one ladder covers the whole product, on the product too - which the catalog badge reads.
#
# namespace/key must match the metafield the storefront app reads. Change them here (or via
# DISCOUNTS_METAFIELD_NAMESPACE / DISCOUNTS_METAFIELD_KEY) - nothing else knows the name.
#
# trophy_discount is a MERCHANT-owned namespace. It has to be: the discount app's own
# app--400283500545 is reserved for that app, and Shopify refused our writes into it outright
# ("Access to this namespace and key on Metafields for this resource type is not allowed", CM373BS,
# 2026-09-03). Check what a store holds with
#   python tools/check_discount_metafield.py --store <shop>.myshopify.com --namespace trophy_discount
# ---------------------------------------------------------------------------
discounts:
  enabled: ${DISCOUNTS_ENABLED:true}
  namespace: "${DISCOUNTS_METAFIELD_NAMESPACE:trophy_discount}"
  key: "${DISCOUNTS_METAFIELD_KEY:discount_tiers}"
  # json unless the consuming app defined it otherwise (multi_line_text_field holds the same string).
  type: "${DISCOUNTS_METAFIELD_TYPE:json}"

# ---------------------------------------------------------------------------
# Shopify Admin API (sync target)
#
# Secrets are sensitive: provide them via environment variables (or an untracked
# application-local.yaml) — never commit real credentials. Client credentials are
# exchanged for a short-lived Admin API token that is cached and auto-refreshed.
# ---------------------------------------------------------------------------
shopify:
  store-domain: "${SHOPIFY_STORE_DOMAIN:}"   # e.g. trophypartner.myshopify.com
  client-id: "${SHOPIFY_CLIENT_ID:}"
  client-secret: "${SHOPIFY_CLIENT_SECRET:}"
  webhook-secret: "${SHOPIFY_WEBHOOK_SECRET:}"
  api-version: "${SHOPIFY_API_VERSION:2026-04}"
  # Inventory location GID quantities are written to, e.g. gid://shopify/Location/123
  location-id: "${SHOPIFY_LOCATION_ID:gid://shopify/Location/81537040495}"
  # Shopify rate-limits by query COST and reports exhaustion as HTTP 200 + errors[].extensions.code
  # = THROTTLED. Those calls are retried (waiting the bucket's own restore time when the response
  # reports it, else exponential backoff) instead of failing the operation.
  retry:
    max-attempts: 4                  # 1 disables retrying
    initial-backoff: 500ms
    max-backoff: 8s
#  location-id: "${SHOPIFY_LOCATION_ID:gid://shopify/Location/74343743582}"

# ---------------------------------------------------------------------------
# Supplier -> Shopify sync
# ---------------------------------------------------------------------------
sync:
  # ---------------------------------------------------------------------------
  # Postgres persistence master switch.
  #
  # false (default) = today's behaviour exactly: catalog indexes in memory + data/*.json, and the
  # scheduler re-pushes every imported product. No database is contacted, none is required.
  #
  # true = the catalog mirror and the sync bookkeeping live in Postgres (spring.datasource above).
  # Rolling back is setting this to false and restarting; the database is left untouched.
  # ---------------------------------------------------------------------------
  # Default MUST stay false: with it on, any environment without DB_URL (a fresh checkout, the test
  # suite, a rollback) fails at startup on "Failed to determine a suitable driver class". Turn it on
  # where the database actually is — .env on the server, application-local.yaml here.
  persistence:
    enabled: ${SYNC_PERSISTENCE_ENABLED:false}

  supplier-code: PaceSetter          # stamped on products + used in the deterministic handle
  # Store metaobject entry identifying this supplier. When handle is set, every import writes the
  # custom.promo_standard_supplier product metafield (metaobject_reference) pointing at this entry;
  # its GID is resolved via metaobjectByHandle (app token needs the read_metaobjects scope).
  supplier-metaobject:
    type: promo_standard_supplier
    handle: pace-setter
  # Create the custom.ps_* metafield DEFINITIONS at startup (admin visibility only). Needs the
  # write_metafield_definitions scope; leave false unless the app token has it — sync stamps the
  # metafield values regardless.
  ensure-metafield-definitions: false
  currency: USD
  country: US
  language: en
  # Variant SKU strategy: PART (partId) | PART_SIZE (partId-size)
  sku-strategy: PART_SIZE
  # ---------------------------------------------------------------------------
  # Retail pricing.
  #
  # SUPPLIER_LIST (default): publish the supplier's own suggested retail whenever it publishes one.
  # PromoStandards returns it from getConfigurationAndPricing with priceType=List — for PaceSetter
  # that is exactly the price on their public product page (GM668A: net 88.20 -> list 147.00). The
  # markup below is only the fallback, for suppliers that publish no retail price.
  #
  # Rounding applies to BOTH paths, in opposite directions, and that is deliberate: a price we
  # computed ourselves is charm-priced UP (13.30 -> 13.99, keeping the margin), while a price the
  # supplier states is charm-priced DOWN (208.00 -> 207.99) so the store never publishes above what
  # the supplier itself asks. The .99 ending is a client requirement, and the quantity-break ladder
  # is derived from these same rounded prices — see PLAN-DESCUENTOS.md.
  #
  # MARKUP: ignore any published retail and always compute from the net price.
  #
  # Both are environment-overridable so pricing can be retuned without a rebuild.
  # ---------------------------------------------------------------------------
  pricing:
    strategy: ${SYNC_PRICING_STRATEGY:SUPPLIER_LIST}   # SUPPLIER_LIST | MARKUP
    markup-percent: ${SYNC_PRICING_MARKUP_PERCENT:40}  # fallback only: net * (1 + markup)
    rounding: ${SYNC_PRICING_ROUNDING:NINETY_NINE}     # NONE | NINETY_NINE (both paths; see above)
    map-floor: ${SYNC_PRICING_MAP_FLOOR:true}          # never price below the supplier list price
  schedule:
    enabled: false                   # master switch for all scheduled jobs
    inventory-cron: "0 0/30 * * * *" # every 30 min
    price-cron: "0 0 3 * * *"        # daily at 03:00
    order-cron: "0 0/15 * * * *"     # every 15 min
    # Evaluate every product and log what WOULD be pushed, without writing to Shopify. Turn this on
    # for the first scheduled runs after enabling persistence: pass one should report everything as
    # due, and (after a real run) pass two almost nothing. That contrast is the proof the incremental
    # logic works before it is allowed to write.
    dry-run: ${SYNC_SCHEDULE_DRY_RUN:false}

  # Catalog read model (the console table). Supplier data barely changes but the console re-reads it
  # constantly (paging, filtering, reloads), so both reads are cached with a TTL; a product then costs
  # its upstream calls once per window no matter how many rows/tabs/users ask. fetch-threads also caps
  # how many supplier calls the catalog makes at once (each product detail fans out to 5 services in
  # parallel), so raise it only as far as the supplier tolerates.
  catalog:
    detail-ttl: 15m                  # assembled per-product detail (0 disables detail caching)
    list-ttl: 1h                     # discovered sellable-id list (0 disables it)
    max-products: 2000               # cap on cached details, bounds memory on a large catalog
    fetch-threads: 12

  # Title index: product name + vendor for every catalog id, so the console's search box matches
  # NAMES locally (without it, searching only matched ids and the rows already loaded). Built on
  # demand in the background from the same shared catalog pass as the group index below — enabling
  # both costs one pass, not two — and persisted so a restart doesn't repeat it.
  title-index:
    enabled: true                    # false = search matches product ids only
    cache-file: data/catalog-titles.json
    ttl: 24h

  # "Group variants" index for the console table: collapses sibling product ids (one product the
  # supplier split across ids, e.g. one per size) into one row, keyed on Common Grouping related
  # products. Built ON DEMAND (never at startup) with one getProduct per product, throttled to 5
  # concurrent, cached in memory AND persisted to cache-file so a restart doesn't repeat the pass.
  group-index:
    enabled: true                    # false = flat list only (no grouping)
    cache-file: data/catalog-group-index.json   # persisted across restarts (working-dir relative)
    ttl: 24h                         # freshness window; a stale index rebuilds in the background (0 = only on manual refresh)

  # Extra product metafields written on every import. Each entry needs namespace/key/type matching
  # an existing Shopify metafield definition, and either a constant `value` or a `source` naming a
  # supplier field to copy: title | description | vendor | productType | productId | tags | supplierCode.
  # (The app always also writes custom.ps_supplier, custom.ps_product_id, custom.ps_price_breaks,
  #  custom.promo_standard_supplier — see supplier-metaobject above — and, on each VARIANT,
  #  custom.promo_standard_id = the supplier product id.)
  metafields: []
  #  - { namespace: custom, key: country_of_origin, type: single_line_text_field, value: "China" }
  #  - { namespace: custom, key: supplier_brand,    type: single_line_text_field, source: vendor }
  #  - { namespace: custom, key: ps_categories,     type: list.single_line_text_field, source: tags }
