# Runs the PromoStandards integration service on the server (Contabo).
#
#   cp .env.example .env    # then fill in the real credentials
#   docker compose build
#   docker compose up -d
#
# The port is bound to 127.0.0.1 ON PURPOSE: the app has no authentication, so it must not
# be reachable from the internet directly. Front it with nginx + basic auth (see DEPLOY.md),
# or reach it through an SSH tunnel: ssh -L 8080:127.0.0.1:8080 <server>.

services:
  promostandards:
    build: .
    image: promostandards:latest
    container_name: promostandards
    restart: unless-stopped
    ports:
      - "127.0.0.1:8080:8080"
    env_file:
      - .env
    environment:
      SPRING_PROFILES_ACTIVE: prod
    # Postgres runs on the host, not in this compose file. On Linux `host.docker.internal` does
    # not resolve unless it is mapped explicitly, so DB_URL in .env would fail without this.
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      # Catalog indexes (titles + variant families) are cached here. Without this mount they live
      # in the container's writable layer, so every `docker compose up -d` that recreates the
      # container throws them away and the next console load rebuilds them with one getProduct per
      # product — ~1,278 calls to the supplier per deploy.
      - ./data:/app/data
